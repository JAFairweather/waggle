name: CI

# Run the test suite on every PR and on pushes to main (issue #38). Every suite in
# the `test` script is side-effect-free (temp dirs, stubbed sends), so they are safe
# to run unattended. A visible green check replaces "whoever remembered to run it
# locally", and is part of the credibility story for a public repo.
#
# Deliberately no suite count or roster here: package.json's `test` script is the only
# place that knows it, and a restated count goes stale silently — this one drifted to
# three different numbers in a day.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # A real .git checkout is required: tests/deploy_verify.mjs drives
        # `git archive HEAD` / `git cat-file` to build its fixture. The default
        # shallow depth is fine — HEAD is present.
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # matches the deployed runtime; package.json engines is >=20
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        # Before the suite, because it is the cheaper failure and it catches a class the
        # suite cannot: an identifier that does not exist on a path no test happens to take.
        # Correctness rules only — no formatting opinions (see eslint.config.mjs).
        run: npm run lint

      - name: Provide a config for the suite
        # config.json is gitignored — per-box routing policy lives on the host
        # (issue #104), not in git. The committed example carries the schema the
        # suite needs; a1 grounds in it, the others write their own temp configs.
        run: cp config.example.json config.json

      - name: Test
        run: npm test

      - name: Build the zero-install agent bundle
        # `tests/agent_bundle.mjs` already builds and drives it, so this step is not a second
        # correctness check — it exists to produce the artifact and to fail on a Node the bundle
        # would not run on. The runner is Node 22; the bundle targets Node 20, which is the floor
        # package.json declares and the version the hosts this bundle exists for actually run.
        run: npm run build:agent

      - name: Attach the bundle
        # The deliverable for a host that refuses `git clone` and `npm ci` (#586). Downloadable from
        # the run, so an agent can be handed one file and a URL rather than an install procedure.
        uses: actions/upload-artifact@v4
        with:
          name: waggle-agent-${{ github.sha }}
          path: dist/waggle-agent.mjs
          if-no-files-found: error
