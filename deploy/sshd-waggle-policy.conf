# Installed as /etc/ssh/sshd_config.d/60-waggle-policy.conf.
# The key file is root-owned, and ForceCommand makes the account a one-socket
# capability rather than a shell or a deploy principal.
Match User waggle-policy-ingress
    AuthorizedKeysFile /etc/ssh/authorized_keys/waggle-policy-ingress
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    ForceCommand /usr/bin/node /opt/waggle-policy/tools/buzz-policy-forward.mjs
