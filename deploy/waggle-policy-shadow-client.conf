# Optional read-lane drop-in for #54 derive-only shadow comparison. Install only after both
# root-owned sources exist. The private SSH key is a forced-command capability, never a management
# key and never the live policy ingress key.
[Service]
LoadCredential=policy-shadow-ssh:/etc/waggle/policy-client/shadow_ed25519
LoadCredential=policy-shadow-known-hosts:/etc/waggle/policy-client/known_hosts
Environment=POLICY_SHADOW_IDENTITY_FILE=%d/policy-shadow-ssh
Environment=POLICY_SHADOW_KNOWN_HOSTS_FILE=%d/policy-shadow-known-hosts
